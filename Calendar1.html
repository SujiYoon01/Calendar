<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 우주사업총괄 KPI &amp; HR Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #fbfaf7;
    --ink: #17160f;
    --ink-2: #5c5a4f;
    --ink-muted: #9b978a;
    --grid: #dedad0;
    --grid-soft: #ececE4;
    --border: rgba(23,22,15,0.10);
    --accent-biz: #1f6f72;
    --accent-biz-soft: #e4f1ef;
    --accent-hr: #7a4f96;
    --accent-hr-soft: #f0e8f4;
    --khaki: #cfa843;
    --khaki-soft: #f2e3b0;
    --strong-border: #3a3324;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #14140f; --surface: #1c1b16; --surface-2: #201f19;
      --ink: #f4f2ea; --ink-2: #c7c3b5; --ink-muted: #8f8b7d;
      --grid: #3a3930; --grid-soft: #2b2a24; --border: rgba(244,242,234,0.12);
      --accent-biz: #4aa3a4; --accent-biz-soft: #1c3130;
      --accent-hr: #b28dcb; --accent-hr-soft: #322a3a;
      --khaki: #d9b656; --khaki-soft: #3d3213; --strong-border: #e8e2d2;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #14140f; --surface: #1c1b16; --surface-2: #201f19;
    --ink: #f4f2ea; --ink-2: #c7c3b5; --ink-muted: #8f8b7d;
    --grid: #3a3930; --grid-soft: #2b2a24; --border: rgba(244,242,234,0.12);
    --accent-biz: #4aa3a4; --accent-biz-soft: #1c3130;
    --accent-hr: #b28dcb; --accent-hr-soft: #322a3a;
    --khaki: #d9b656; --khaki-soft: #3d3213; --strong-border: #e8e2d2;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .wrap {
    max-width: 1900px;
    margin: 0 auto;
    padding: 18px 22px 14px;
    width: 100%;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    flex: none;
  }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.01em; }
  header.top p { margin: 3px 0 0; color: var(--ink-2); font-size: 12px; }
  .btn-print {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .btn-print:hover { border-color: var(--accent-biz); color: var(--accent-biz); }

  .control-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 8px; flex: none;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-pill {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 13px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .filter-pill i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-muted); }
  .filter-pill:hover { border-color: var(--ink-muted); }
  .filter-pill[data-f="biz"].active { background: var(--accent-biz); border-color: var(--accent-biz); color: #fff; }
  .filter-pill[data-f="biz"].active i { background: #fff; }
  .filter-pill[data-f="hr"].active { background: var(--accent-hr); border-color: var(--accent-hr); color: #fff; }
  .filter-pill[data-f="hr"].active i { background: #fff; }
  .filter-pill[data-f="all"].active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .filter-pill[data-f="all"].active i { background: var(--surface); }
  .filter-pill[data-f="biz"] i { background: var(--accent-biz); }
  .filter-pill[data-f="hr"] i { background: var(--accent-hr); }

  .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--grid); position: relative; transition: background .15s ease; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform .15s ease; }
  .switch input:checked + .track { background: var(--accent-biz); }
  .switch input:checked + .track::after { transform: translateX(14px); }

  body.edit-on .ed { outline: none; border-radius: 4px; cursor: text; }
  body.edit-on .ed:hover { background: color-mix(in srgb, var(--accent-biz) 10%, transparent); }
  body.edit-on .ed:focus { background: var(--surface-2); box-shadow: 0 0 0 2px var(--accent-biz); }

  .edit-banner {
    display: none; align-items: center; gap: 8px; background: var(--khaki-soft);
    border: 1px solid color-mix(in srgb, var(--khaki) 50%, transparent); color: var(--ink);
    font-size: 11.5px; border-radius: 9px; padding: 6px 12px; margin-bottom: 8px; flex: none;
  }
  body.edit-on .edit-banner { display: flex; }

  .legend-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .swatch { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
  .swatch i { width: 12px; height: 9px; border-radius: 2px; display: inline-block; flex: none; border: 1px solid var(--grid); }

  .stat-bar {
    display: flex; align-items: stretch; gap: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; flex: none; overflow: hidden;
  }
  .stat { padding: 8px 18px; display: flex; align-items: baseline; gap: 8px; border-right: 1px solid var(--grid); }
  .stat:last-child { border-right: none; }
  .stat .n { font-size: 18px; font-weight: 900; letter-spacing: -0.01em; }
  .stat .l { font-size: 11px; color: var(--ink-muted); font-weight: 600; }

  .stage { flex: 0 1 auto; min-height: 0; position: relative; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .table-shell { display: inline-block; min-width: 100%; }
  table.kpi { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 11.5px; }
  table.kpi th, table.kpi td {
    border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
    padding: 0; vertical-align: middle; background: var(--surface);
    overflow: hidden; word-break: break-word;
  }
  table.kpi thead th {
    background: var(--accent-biz-soft); color: var(--ink); font-size: 11px; font-weight: 700;
    padding: 7px 5px; text-align: center; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .c-lead { border-right: 2px solid var(--border) !important; }

  .c-ctrl     { display: none; width: 62px; }
  body.edit-on .c-ctrl { display: table-cell; }
  .c-section  { width: 42px; }
  .c-group    { width: 100px; }
  .c-subgroup { width: 118px; }
  .c-weight   { width: 46px; }
  .c-target   { width: 160px; }
  .c-kpi      { width: 54px; }
  .c-detail   { width: 210px; }
  .c-sub      { width: 96px; }

  td.c-ctrl { padding: 3px; background: var(--surface-2); }
  .ctrl-merge { display: flex; gap: 2px; margin-bottom: 2px; }
  .mbtn {
    flex: 1; appearance: none; border: 1px solid var(--grid); background: var(--surface);
    color: var(--ink-muted); font-size: 9px; font-weight: 800; border-radius: 3px;
    padding: 2px 0; cursor: pointer; line-height: 1.2;
  }
  .mbtn.on { background: var(--accent-biz); border-color: var(--accent-biz); color: #fff; }
  .mbtn[disabled] { opacity: .35; cursor: not-allowed; }
  .ctrl-actions { display: flex; gap: 2px; }
  .ctrl-actions button {
    flex: 1; appearance: none; border: 1px solid var(--border); background: var(--surface);
    font-size: 10px; font-weight: 800; border-radius: 3px; padding: 1px 0; cursor: pointer; color: var(--ink-2);
  }
  .addbtn:hover { border-color: #2f8f4e; color: #2f8f4e; }
  .delbtn:hover { border-color: #bd4038; color: #bd4038; }

  td.c-section {
    padding: 6px 2px; text-align: center; font-weight: 900; letter-spacing: .05em; font-size: 10px;
    writing-mode: vertical-rl; text-orientation: upright;
  }
  td.c-section.section-biz { background: var(--accent-biz-soft); color: var(--accent-biz); }
  td.c-section.section-hr  { background: var(--accent-hr-soft); color: var(--accent-hr); }

  td.c-group { padding: 6px 6px; font-weight: 700; font-size: 11px; line-height: 1.28; text-align: center; }
  td.c-group.section-biz { border-left: 3px solid var(--accent-biz); }
  td.c-group.section-hr  { border-left: 3px solid var(--accent-hr); }

  td.c-subgroup { padding: 6px 6px; font-weight: 600; font-size: 10.8px; line-height: 1.28; text-align: center; color: var(--ink-2); }
  td.c-weight { padding: 6px 3px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  td.c-target { padding: 6px 6px; font-weight: 700; line-height: 1.28; text-align: center; }
  td.c-kpi { padding: 6px 4px; font-weight: 700; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; font-size: 10.5px; }
  td.c-detail { padding: 6px 7px; line-height: 1.28; color: var(--ink-2); text-align: center; font-size: 10.5px; }
  td.c-sub { padding: 6px 6px; line-height: 1.24; color: var(--ink-2); text-align: center; font-size: 10px; background: var(--surface-2); }
  td.c-extra { padding: 6px 7px; line-height: 1.28; color: var(--ink-2); text-align: center; font-size: 10.5px; }

  .c-addcol { display: none; width: 26px; }
  body.edit-on .c-addcol { display: table-cell; }
  .addcol-btn {
    display: none; width: 100%; height: 100%; min-height: 26px;
    appearance: none; border: none; background: transparent; color: var(--ink-muted);
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  body.edit-on .addcol-btn { display: block; }
  .addcol-btn:hover { color: var(--accent-biz); }
  .col-head-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .delcol-btn {
    display: none; appearance: none; border: none; background: transparent;
    color: var(--ink-muted); font-size: 10px; font-weight: 800; cursor: pointer; line-height: 1; padding: 0;
  }
  body.edit-on .delcol-btn { display: inline-block; }
  .delcol-btn:hover { color: #bd4038; }

  body.filter-biz tr.section-hr-row { display: none; }
  body.filter-hr tr.section-biz-row { display: none; }

  td.c-month {
    padding: 0; height: 30px; text-align: center; vertical-align: middle;
    transition: background-color .08s ease; width: 90px;
  }
  th.c-month-h { width: 90px; }
  td.c-month:hover { background-color: var(--grid-soft); }

  td.chip-cell {
    padding: 2px 4px; font-size: 9.5px; font-weight: 700; line-height: 1.15;
    text-align: center; vertical-align: middle; color: var(--ink-2);
  }
  td.chip-cell.hl { background: var(--khaki-soft); color: var(--ink); font-weight: 800; }
  td.chip-cell.strong { border: 1.5px solid var(--strong-border) !important; font-weight: 900; }
  td.chip-cell:hover { filter: brightness(0.95); }

  @media print {
    body { overflow: visible; height: auto; }
    .stage { overflow: visible; height: auto; border: none; }
    .btn-print, .c-ctrl { display: none !important; }
    @page { size: A3 landscape; margin: 8mm; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>2026 우주사업총괄 KPI &amp; HR Calendar</h1>
      <p>사업부 KPI 및 HR 스케줄을 한눈에 보는 HRBP 리포트</p>
    </div>
    <button type="button" class="btn-print" id="printBtn">인쇄 / PDF</button>
  </header>

  <div class="control-row">
    <label class="switch">
      <input type="checkbox" id="editToggle" aria-label="편집 모드" />
      <span class="track"></span>
      편집 모드
    </label>
    <div class="filter-group">
      <button type="button" class="filter-pill active" data-f="all"><i></i>전체</button>
      <button type="button" class="filter-pill" data-f="biz"><i></i>사업부 KPI</button>
      <button type="button" class="filter-pill" data-f="hr"><i></i>HR Calendar</button>
    </div>
    <div class="legend-row">
      <span class="swatch"><i style="background:var(--surface)"></i>일반</span>
      <span class="swatch"><i style="background:var(--khaki-soft)"></i>강조 표시</span>
    </div>
  </div>

  <div class="edit-banner">✎ 편집 모드 — 왼쪽 칸의 <b>구/소/K/세</b> 버튼으로 구분·소구분(가중치·목표 포함)·KPI No.·세부내용 셀을 위 행과 병합/분리, <b>+/×</b>로 행 추가/삭제, 세부구분 오른쪽 끝 <b>+</b>로 열 추가. 텍스트는 클릭해서 바로 수정. 저장은 안 되니 캡처해서 보내주세요.</div>

  <div class="stat-bar" id="summaryRow"></div>

  <div class="stage" id="stage">
    <div class="table-shell" id="tableShell">
      <table class="kpi" id="kpiTable" aria-label="2026 우주사업 KPI 및 HR 스케줄">
        <colgroup id="colgroup"></colgroup>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

  var EXTRA_COLS = []; // { id, title }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c];
    });
  }
  function nl2br(s){ return esc(s).replace(/\n/g, "<br>"); }

  function renderColgroup(){
    var cg = document.getElementById("colgroup");
    var html = '<col id="col-ctrl" style="width:' + (editMode ? "62px" : "0px") + '">';
    html += '<col style="width:42px">';   // section
    html += '<col style="width:100px">';  // group
    html += '<col style="width:118px">';  // subgroup
    html += '<col style="width:46px">';   // weight
    html += '<col style="width:160px">';  // target
    html += '<col style="width:54px">';   // kpi
    html += '<col style="width:210px">';  // detail
    html += '<col style="width:96px">';   // sub
    EXTRA_COLS.forEach(function(){ html += '<col style="width:140px">'; });
    html += '<col id="col-addcol" style="width:' + (editMode ? "26px" : "0px") + '">';   // addcol
    MONTHS.forEach(function(){ html += '<col style="width:90px">'; });
    cg.innerHTML = html;
  }

  // Real <td> per month (merged via colspan for multi-month chips) — this
  // guarantees pixel-perfect alignment with the header, since grid lines are
  // actual cell borders on the same columns, not a simulated background.
  function monthCellsHTML(row, idx){
    var byStart = {};
    row.chips.forEach(function(c, ci){ byStart[c.s] = { c: c, ci: ci }; });
    var covered = 0; // remaining months already consumed by an earlier chip
    var html = "";
    MONTHS.forEach(function(m){
      if (covered > 0){ covered--; return; }
      var hit = byStart[m];
      if (hit){
        var c = hit.c;
        var span = Math.max(1, Math.min(c.n, 12 - m + 1));
        covered = span - 1;
        html += '<td class="chip-cell' + (c.hl ? ' hl' : '') + (c.strong ? ' strong' : '') + '" colspan="' + span + '" title="' + esc(c.t.replace(/\n/g, " · ")) + '">'
              + '<span class="ed" contenteditable="false" data-idx="' + idx + '" data-field="chip" data-ci="' + hit.ci + '">' + nl2br(c.t) + '</span>'
              + '</td>';
      } else {
        html += '<td class="c-month"></td>';
      }
    });
    return html;
  }

  function computeSpans(mergeKey){
    var spans = new Array(ROWS.length);
    var i = 0;
    while (i < ROWS.length){
      var span = 1;
      while (i + span < ROWS.length && ROWS[i + span][mergeKey]) span++;
      spans[i] = span;
      for (var k = 1; k < span; k++) spans[i + k] = 0;
      i += span;
    }
    return spans;
  }

  function render(){
    var tbody = document.getElementById("tbody");
    var groupSpans = computeSpans("groupMergeUp");
    var sgSpans = computeSpans("sgMergeUp");
    var kpiSpans = computeSpans("kpiMergeUp");
    var detailSpans = computeSpans("detailMergeUp");

    var sectionSpans = new Array(ROWS.length);
    (function(){
      var i = 0;
      while (i < ROWS.length){
        var span = 1;
        while (i + span < ROWS.length && ROWS[i + span].accent === ROWS[i].accent) span++;
        sectionSpans[i] = span;
        for (var k = 1; k < span; k++) sectionSpans[i + k] = 0;
        i += span;
      }
    })();

    var rowsHTML = "";
    ROWS.forEach(function(row, idx){
      var accentClass = row.accent === "hr" ? "section-hr" : "section-biz";
      var rowMarkerClass = row.accent === "hr" ? "section-hr-row" : "section-biz-row";

      rowsHTML += '<tr class="' + rowMarkerClass + '">';

      rowsHTML += '<td class="c-ctrl">'
        + '<div class="ctrl-merge">'
        + '<button type="button" class="mbtn' + (row.groupMergeUp ? ' on' : '') + '" data-act="mtoggle" data-col="group" data-idx="' + idx + '"' + (idx === 0 ? ' disabled' : '') + '>구</button>'
        + '<button type="button" class="mbtn' + (row.sgMergeUp ? ' on' : '') + '" data-act="mtoggle" data-col="sg" data-idx="' + idx + '"' + (idx === 0 ? ' disabled' : '') + '>소</button>'
        + '<button type="button" class="mbtn' + (row.kpiMergeUp ? ' on' : '') + '" data-act="mtoggle" data-col="kpi" data-idx="' + idx + '"' + (idx === 0 ? ' disabled' : '') + '>K</button>'
        + '<button type="button" class="mbtn' + (row.detailMergeUp ? ' on' : '') + '" data-act="mtoggle" data-col="detail" data-idx="' + idx + '"' + (idx === 0 ? ' disabled' : '') + '>세</button>'
        + '</div>'
        + '<div class="ctrl-actions">'
        + '<button type="button" class="addbtn" data-act="addrow" data-idx="' + idx + '" title="아래에 행 추가">+</button>'
        + '<button type="button" class="delbtn" data-act="delrow" data-idx="' + idx + '" title="행 삭제">×</button>'
        + '</div></td>';

      if (sectionSpans[idx] > 0) rowsHTML += '<td class="c-lead c-section ' + accentClass + ' ed" contenteditable="false" data-idx="' + idx + '" data-field="section" rowspan="' + sectionSpans[idx] + '">' + esc(row.section) + '</td>';
      if (groupSpans[idx] > 0){
        var groupColspan = row.subgroup === "" ? 2 : 1;
        rowsHTML += '<td class="c-group ' + accentClass + ' ed" contenteditable="false" data-idx="' + idx + '" data-field="group" rowspan="' + groupSpans[idx] + '"' + (groupColspan === 2 ? ' colspan="2"' : '') + '>' + esc(row.group) + '</td>';
      }
      if (sgSpans[idx] > 0){
        if (row.subgroup !== ""){
          rowsHTML += '<td class="c-subgroup ed" contenteditable="false" data-idx="' + idx + '" data-field="subgroup" rowspan="' + sgSpans[idx] + '">' + esc(row.subgroup) + '</td>';
        }
        rowsHTML += '<td class="c-weight ed" contenteditable="false" data-idx="' + idx + '" data-field="weight" rowspan="' + sgSpans[idx] + '">' + esc(row.weight) + '</td>';
        rowsHTML += '<td class="c-target ed" contenteditable="false" data-idx="' + idx + '" data-field="target" rowspan="' + sgSpans[idx] + '">' + esc(row.target) + '</td>';
      }
      if (kpiSpans[idx] > 0) rowsHTML += '<td class="c-kpi ed" contenteditable="false" data-idx="' + idx + '" data-field="kpi" rowspan="' + kpiSpans[idx] + '">' + esc(row.kpi) + '</td>';
      if (detailSpans[idx] > 0){
        var detailColspan = row.sub === "" ? 2 : 1;
        rowsHTML += '<td class="c-lead c-detail ed" contenteditable="false" data-idx="' + idx + '" data-field="detail" rowspan="' + detailSpans[idx] + '"' + (detailColspan === 2 ? ' colspan="2"' : '') + '>' + esc(row.detail) + '</td>';
      }
      if (row.sub !== "") rowsHTML += '<td class="c-lead c-sub ed" contenteditable="false" data-idx="' + idx + '" data-field="sub">' + nl2br(row.sub) + '</td>';

      EXTRA_COLS.forEach(function(col){
        var val = (row.extra && row.extra[col.id]) || "";
        rowsHTML += '<td class="c-extra ed" contenteditable="false" data-idx="' + idx + '" data-field="extra" data-colid="' + col.id + '">' + esc(val) + '</td>';
      });
      rowsHTML += '<td class="c-addcol"></td>';

      rowsHTML += monthCellsHTML(row, idx);
      rowsHTML += '</tr>';
    });

    tbody.innerHTML = rowsHTML;
    applyEditability();
    renderSummary();
  }

  function renderSummary(){
    var totalRows = ROWS.length, totalChips = 0, hlCount = 0;
    ROWS.forEach(function(row){
      row.chips.forEach(function(c){ totalChips++; if (c.hl) hlCount++; });
    });
    document.getElementById("summaryRow").innerHTML =
      '<div class="stat"><span class="n">' + totalRows + '</span><span class="l">전체 KPI 항목</span></div>' +
      '<div class="stat"><span class="n">' + totalChips + '</span><span class="l">등록된 일정</span></div>' +
      '<div class="stat"><span class="n">' + hlCount + '</span><span class="l">강조 표시 일정</span></div>';
  }

  var editMode = false;
  function applyEditability(){
    document.querySelectorAll(".ed").forEach(function(el){ el.contentEditable = editMode ? "true" : "false"; });
  }

  function setFilter(f){
    document.body.classList.remove("filter-biz", "filter-hr");
    if (f === "biz") document.body.classList.add("filter-biz");
    if (f === "hr") document.body.classList.add("filter-hr");
    document.querySelectorAll(".filter-pill").forEach(function(btn){ btn.classList.toggle("active", btn.dataset.f === f); });
  }

  function syncField(el){
    if (el.dataset.field === "colhead"){
      var col = EXTRA_COLS.filter(function(c){ return c.id === el.dataset.colid; })[0];
      if (col) col.title = el.textContent.trim();
      return;
    }
    var idx = +el.dataset.idx;
    var row = ROWS[idx];
    if (!row) return;
    if (el.dataset.field === "chip"){
      var ci = +el.dataset.ci;
      if (row.chips[ci]) row.chips[ci].t = el.textContent.trim();
    } else if (el.dataset.field === "extra"){
      row.extra = row.extra || {};
      row.extra[el.dataset.colid] = el.textContent.trim();
    } else {
      row[el.dataset.field] = el.textContent.trim();
    }
  }

  var extraColSeq = 0;
  function addColumn(){
    extraColSeq++;
    EXTRA_COLS.push({ id: "extra" + extraColSeq, title: "새 항목" });
    renderColgroup(); renderHead(); render();
  }
  function removeColumn(colId){
    EXTRA_COLS = EXTRA_COLS.filter(function(c){ return c.id !== colId; });
    renderColgroup(); renderHead(); render();
  }

  function addRowAfter(idx){
    var src = ROWS[idx];
    ROWS.splice(idx + 1, 0, {
      accent: src.accent, section: src.section,
      group: src.group, groupMergeUp: true,
      subgroup: src.subgroup, weight: src.weight, target: src.target, sgMergeUp: true,
      kpi: "새 KPI", kpiMergeUp: false,
      sub: "", detail: "새 세부내용을 입력하세요", detailMergeUp: false,
      chips: []
    });
    render();
  }

  function removeRow(idx){
    if (ROWS.length <= 1) return;
    var row = ROWS[idx], next = ROWS[idx + 1];
    [["group","groupMergeUp"], ["sg","sgMergeUp"], ["kpi","kpiMergeUp"], ["detail","detailMergeUp"]].forEach(function(pair){
      var mkey = pair[1];
      if (!row[mkey] && next && next[mkey]){
        next[mkey] = false;
        if (pair[0] === "group") next.group = row.group;
        else if (pair[0] === "sg") { next.subgroup = row.subgroup; next.weight = row.weight; next.target = row.target; }
        else if (pair[0] === "kpi") next.kpi = row.kpi;
        else if (pair[0] === "detail") next.detail = row.detail;
      }
    });
    ROWS.splice(idx, 1);
    render();
  }

  function toggleMerge(col, idx){
    if (idx === 0) return;
    var key = col + "MergeUp";
    ROWS[idx][key] = !ROWS[idx][key];
    render();
  }

  function init(){
    renderColgroup();
    renderHead();
    render();

    document.getElementById("editToggle").addEventListener("change", function(e){
      editMode = e.target.checked;
      document.body.classList.toggle("edit-on", editMode);
      renderColgroup();
      applyEditability();
    });

    document.querySelectorAll(".filter-pill").forEach(function(btn){
      btn.addEventListener("click", function(){
        var f = btn.dataset.f, current = btn.classList.contains("active");
        setFilter(current && f !== "all" ? "all" : f);
      });
    });

    var stage = document.getElementById("stage");

    stage.addEventListener("focusout", function(e){
      var t = e.target;
      if (t.classList && t.classList.contains("ed")) syncField(t);
    });

    stage.addEventListener("keydown", function(e){
      var t = e.target;
      if (!t.classList || !t.classList.contains("ed")) return;
      var multiline = (t.dataset.field === "detail" || t.dataset.field === "target" || t.dataset.field === "chip" || t.dataset.field === "sub");
      if (e.key === "Enter" && !multiline) { e.preventDefault(); t.blur(); }
    });

    stage.addEventListener("click", function(e){
      var actEl = e.target.closest("[data-act]");
      if (!actEl || !editMode) return;
      var idx = +actEl.dataset.idx, act = actEl.dataset.act;
      if (act === "mtoggle") toggleMerge(actEl.dataset.col, idx);
      else if (act === "addrow") addRowAfter(idx);
      else if (act === "delrow") removeRow(idx);
      else if (act === "addcol") addColumn();
      else if (act === "delcol") removeColumn(actEl.dataset.colid);
    });

    document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
